<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Inscrivez-vous aux Atlas Dev Days. Réservez votre place en ligne pour participer à notre conférence tech et choisissez vos ateliers."
    />
    <title>Inscription - Atlas Dev Days</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <a href="index.html">Atlas Dev</a>
      </div>

      <nav>
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li><a href="programme.html">Programme</a></li>
          <li><a href="intervenants.html">Intervenants</a></li>
          <li><a href="inscription.html">Inscriptions</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <section class="registration">
        <div class="page-head-inscription">
          <h1>Inscrivez-vous</h1>
          <p>Réservez votre place pour les Atlas Dev Days.</p>
        </div>

        <div class="page-body">
          <form action="#" method="POST" class="registration-form">
            <div class="form-group">
              <label for="nom">Nom Complet:</label>
              <input type="text" id="nom" name="nom" required />
            </div>

            <div class="form-group">
              <label for="email">Adresse Email:</label>
              <input type="email" id="email" name="email" required />
            </div>

            <div class="form-group">
              <label for="tel">Téléphone:</label>
              <input
                type="tel"
                id="tel"
                name="tel"
                required
                pattern="^(\+212|0)[5-7][0-9]{8}$"
              />
            </div>

            <div class="form-group">
              <label for="role">Votre Profil:</label>
              <select name="role" id="role" required>
                <option value="">Sélectionnez un profil</option>
                <option value="Développeur">Développeur</option>
                <option value="Étudiant">Étudiant</option>
                <option value="Designer">Designer</option>
                <option value="Autre">Autre</option>
              </select>
            </div>

            <fieldset>
              <legend>Ateliers souhaités</legend>
              <label class="choice">
                <input type="checkbox" name="atelier" value="design" />
                Design inclusif
              </label>
              <label class="choice">
                <input type="checkbox" name="atelier" value="ia" />
                L'IA dans votre workflow
              </label>
              <label class="choice">
                <input type="checkbox" name="atelier" value="securite" />
                Sécurité web
              </label>
            </fieldset>

            <fieldset>
              <legend>Journée(s) de participation</legend>
              <label class="choice">
                <input type="radio" name="jour" />
                Jour 1
              </label>
              <label class="choice">
                <input type="radio" name="jour" />
                Jour 2
              </label>
              <label class="choice">
                <input type="radio" name="jour" />
                Les Deux
              </label>
            </fieldset>

            <div class="form-group">
              <label>Message (optionnel) </label>
              <textarea rows="4"></textarea>
            </div>

            <label class="choice">
              <input type="checkbox" required />
              J'accepte que mes données soient utilisées pour l'événement
            </label>

            <button type="submit" class="btn submit-btn">Sign Up</button>
          </form>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="footer-container">
        <p>&copy; 2026 Atlas Dev. Tous droits réservés.</p>
        <div class="social-links">
          <a href="#">Twitter</a>
          <a href="#">LinkedIn</a>
          <a href="#">GitHub</a>
        </div>
      </div>
    </footer>
  </body>
</html>
